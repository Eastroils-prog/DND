<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Keeper — NPCs & Market</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <!-- If anything breaks, show a red bar with the error so it can be sent to Claude -->
  <script>
    window.APP_VERSION = '8';
    window.showAppError = function (msg) {
      var b = document.getElementById('appError');
      if (!b) { b = document.createElement('div'); b.id = 'appError'; b.className = 'app-error'; document.body.prepend(b); }
      b.textContent = '⚠️ Something went wrong (version ' + window.APP_VERSION + '): ' + msg + ' — please send this message to Claude. Tip: press Ctrl + Shift + R to reload.';
    };
    window.addEventListener('error', function (e) { window.showAppError((e.message || 'error') + (e.filename ? ' in ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { window.showAppError(String(e.reason && e.reason.message || e.reason)); });
  </script>

  <header class="topbar">
    <div class="brand">🐉 World Keeper <span class="ver">v8</span></div>
    <nav class="tabs" id="tabs">
      <a href="#npcs" data-tab="npcs">🧙 NPCs</a>
      <a href="#locations" data-tab="locations">🏰 Locations</a>
      <a href="#factions" data-tab="factions">⚜️ Factions</a>
      <a href="#maps" data-tab="maps">🗺 Maps</a>
      <a href="#bestiary" data-tab="bestiary">🐉 Bestiary</a>
      <a href="#tree" data-tab="tree">🌳 Family Tree</a>
      <a href="#market" data-tab="market">💰 Market</a>
      <a href="#cloud" data-tab="cloud">☁️ Cloud & Backup</a>
    </nav>
    <a href="#cloud" id="syncStatus" class="sync" hidden></a>
  </header>
  <div id="openWarn" class="open-warn" hidden>🔓 Login is switched off — anyone who opens this website can see and change your world. Switch it on with <b>SETUP.md</b>.</div>
  <main id="app"></main>
  <div id="toast" class="toast" role="status"></div>

  <!-- Supabase = the cloud database + login. If it can't load (offline), the app still works locally. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="config.js?v=8"></script>
  <script src="cloud.js?v=8"></script>
  <script src="similar.js?v=8"></script>
  <script src="magic-items.js?v=8"></script>
  <script src="market.js?v=8"></script>
  <script src="world-data.js?v=8"></script>
  <script src="world-gen.js?v=8"></script>
  <script src="bestiary.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
